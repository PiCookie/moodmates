<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moodmates demo</title>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.0.0",
      "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
      "react-dom/client": "https://esm.sh/react-dom@19.0.0/client"
    }
  }
  </script>
  <style>
    :root { color-scheme: light dark; --bg: #fafaf7; --fg: #2b2b2b; --card: #fff; --line: #e3e1da; --accent: #d9622b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1b1a; --fg: #eee; --card: #262625; --line: #3a3a38; --accent: #f08a57; }
    }
    * { box-sizing: border-box; }
    /* Eine Sprechblase am Rand soll keinen seitlichen Scrollbalken erzeugen. */
    body { overflow-x: clip; margin: 0; padding: 0 16px 48px; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 1000px; margin: 0 auto; }
    h1 { margin: 32px 0 4px; }
    .lead { margin: 0 0 24px; opacity: .75; }
    .controls { z-index: 5; display: flex; flex-wrap: wrap; gap: 12px 20px;
                align-items: center; padding: 12px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
    /* Auf dem Handy nimmt die Leiste zu viel Platz weg, deshalb klebt sie nur auf breiten Bildschirmen. */
    @media (min-width: 700px) { .controls { position: sticky; top: 0; } }
    .moods { display: flex; gap: 6px; flex-wrap: wrap; }
    button.mood, label.live { font: inherit; border: 1px solid var(--line); background: var(--card);
                              color: inherit; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
    button.mood[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    select { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px;
             background: var(--card); color: inherit; }
    input[type="search"], input[type="text"] { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px;
                           background: var(--card); color: inherit; }
    h2 { margin: 32px 0 12px; font-size: 1.1rem; }
    h3 { margin: 24px 0 8px; font-size: .95rem; color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .card { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; padding: 12px 6px;
            min-width: 0;
            background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
    .card code { font-size: .8rem; opacity: .7; }
    .card.soon .pet { filter: blur(3px); opacity: .55; pointer-events: none; }
    .card .badge { font-size: .7rem; font-style: italic; color: var(--accent); }
    .say-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .say-row input { flex: 1 1 200px; min-width: 0; }
    .live-area { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; padding: 16px;
                 background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
    /* The bar is compact by default (max-width 200px); the demo shows it wider. */
    .wide-bar .mm-mood-bar { max-width: 520px; }
    .wide-bar .mm-mood-bar__bar { height: 0.75rem; }
    .wide-bar .mm-mood-bar__legend-item { font-size: 13px; }
    #status { padding: 24px 0; opacity: .7; }
    footer { margin-top: 40px; font-size: .85rem; opacity: .65; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>moodmates</h1>
  <p class="lead">All species on one page. Pick a mood, search by name, tap a living animal.</p>
  <div id="root"><p id="status">Loading…</p></div>
  <footer>
    Loads <code>../dist</code> when it exists (after <code>pnpm build</code>), otherwise the
    <a href="https://www.npmjs.com/package/moodmates">npm package</a>. The texts are the English defaults.
  </footer>
</main>

<script type="module">
  const status = document.getElementById('status');
  let lib, css;
  try {
    lib = await import('../dist/index.js');
    css = '../dist/styles.css';
  } catch {
    try {
      lib = await import('https://esm.sh/moodmates?external=react');
      css = 'https://cdn.jsdelivr.net/npm/moodmates/dist/styles.css';
    } catch (e) {
      status.textContent = 'Could not load moodmates. Run "pnpm build" and serve the repo root (e.g. npx serve).';
      throw e;
    }
  }
  document.head.append(Object.assign(document.createElement('link'), { rel: 'stylesheet', href: css }));

  const React = await import('react');
  const { createRoot } = await import('react-dom/client');
  const { Moodmate, MoodmateSprite, MoodHistoryBar, ALL_PET_TYPES, MESSAGES_EN } = lib;
  // Ältere Versionen (z. B. das npm-Paket als Rückfall oder ein altes dist im Cache) kennen die Liste noch nicht.
  const COMING_SOON_PET_TYPES = lib.COMING_SOON_PET_TYPES ?? [];
  // Ebenso die Kategorien: ohne sie bleibt es bei einer Liste.
  const PET_CATEGORIES = lib.PET_CATEGORIES ?? null;
  // Und die Sprachen: ohne MESSAGES_DE gibt es keine Auswahl.
  const MESSAGES_DE = lib.MESSAGES_DE ?? null;
  const { useState } = React;

  const MOODS = ['frozen', 'cold', 'neutral', 'warm', 'hot'];
  const h = React.createElement;

  function App() {
    const [mood, setMood] = useState('neutral');
    const [query, setQuery] = useState('');
    const [live, setLive] = useState(false);
    const [language, setLanguage] = useState('en');
    const [sentence, setSentence] = useState('Hello from the demo! 👋');
    // Jedes Anklicken legt ein neues Objekt an, so erscheint die Blase auch bei gleichem Text erneut.
    const [say, setSay] = useState(null);
    const M = language === 'de' && MESSAGES_DE ? MESSAGES_DE : MESSAGES_EN;
    const q = query.trim().toLowerCase();
    const types = ALL_PET_TYPES.filter((t) =>
      !q || t.includes(q) || (M.petNames[t] ?? '').toLowerCase().includes(q));
    const Pet = live ? Moodmate : MoodmateSprite;
    const groups = PET_CATEGORIES
      ? PET_CATEGORIES
          .map((c) => ({ key: c, title: M.categoryNames?.[c] ?? c, types: lib.petTypesIn(c).filter((t) => types.includes(t)) }))
          .filter((g) => g.types.length > 0)
      : [{ key: 'all', title: null, types }];

    return h(React.Fragment, null,
      h('div', { className: 'controls' },
        h('div', { className: 'moods', role: 'group', 'aria-label': 'Mood' },
          MOODS.map((m) => h('button', { key: m, className: 'mood', 'aria-pressed': m === mood,
            onClick: () => setMood(m) }, M.moodLabels[m] ?? m))),
        MESSAGES_DE && h('select', { 'aria-label': 'Language', value: language, onChange: (e) => setLanguage(e.target.value) },
          h('option', { value: 'en' }, 'English'),
          h('option', { value: 'de' }, 'Deutsch')),
        h('input', { type: 'search', placeholder: `Search ${ALL_PET_TYPES.length} species`,
          'aria-label': 'Search species', value: query, onChange: (e) => setQuery(e.target.value) }),
        h('label', { className: 'live' },
          h('input', { type: 'checkbox', checked: live, onChange: (e) => setLive(e.target.checked) }),
          ' Living (blink, talk)')),
      h('h2', null, `Species (${types.length} of ${ALL_PET_TYPES.length})`),
      groups.map((g) => h('section', { key: g.key },
        g.title && h('h3', null, `${g.title} (${g.types.length})`),
        h('div', { className: 'grid' },
          g.types.map((t) => {
            const soon = COMING_SOON_PET_TYPES.includes(t);
            return h('div', { key: t, className: soon ? 'card soon' : 'card' },
              h('div', { className: 'pet' }, h(Pet, { type: t, mood, language, size: 84 })),
              h('code', null, t),
              soon && h('span', { className: 'badge' }, 'coming soon'));
          })))),
      h('h2', null, 'History bar'),
      h('div', { className: 'wide-bar' },
        h(MoodHistoryBar, { language, moods: ['frozen', 'cold', 'cold', 'neutral', 'neutral', 'warm', 'hot', 'hot', 'warm', 'neutral'] })),
      h('h2', null, 'All moods of one animal'),
      h('p', { className: 'lead' }, 'Tap an animal, or make them all say your own sentence (the say prop).'),
      h('div', { className: 'say-row' },
        h('input', { type: 'text', 'aria-label': 'Sentence', value: sentence, onChange: (e) => setSentence(e.target.value) }),
        h('button', { className: 'mood', onClick: () => setSay({ text: sentence }) }, 'Say it')),
      h('div', { className: 'live-area' },
        MOODS.map((m) => h(Moodmate, { key: m, type: 'cat', mood: m, language, say, name: M.moodLabels[m] ?? m, size: 96 }))));
  }

  createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
